<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log("*********Do While***********");
        let x = 2;
        do{
            console.log("do while Last value = " + x);
            x++;
        }while(x <= 5);

        x = 0;

        console.log("*********While***********");
        while(x <= 10){
            console.log("while do Last value = " + x);
            x++;
        }

    </script>
</body>
</html>
