<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        //These are called increment and decrement operators in JavaScript.
        // x++;
        let x = 5;
        console.log("x = " + x);
        x = x + 1; // 6
        console.log("x = " + x);
        x++; //7
        console.log("x = " + x);
        x--; // 6
        console.log("x = " + x);
        --x; // 5
        console.log("x = " + x);//5        
        console.log("x = " + x++); // 5, use, increament
        console.log("x = " + x); // 6, use
        console.log("x = " + ++x); // 7, increament, use
        console.log("x = " + x); // 7, use

        console.log("x = " + --x); // 6, decreament, use
        console.log("x = " + x); // 6, use

        // x--;
        // ++x;
        // --x;
        

        
        
    </script>
    
</body>
</html>
