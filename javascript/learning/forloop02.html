<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Loop</title>
</head>
<body>
    <script>
        
        /*
        *
        **
        ***
        ****
        *****        
        */

        

        for(let x = 1; x<= 5; x++){
            console.log("first loop")
            let str = "";
            for(let y = 1; y<= x; y++){
                str = str + "*";
                console.log("second loop " + y)
            }
            console.log(str);         
        }



    </script>
</body>
</html>
