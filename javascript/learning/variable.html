<html>
    <head>
        <title>CSS Variables</title>      
         <script>
            function total(){
               var x = 10; 
                var y = 20;
                var xy = x + y;
                document.getElementById("demo").innerText = xy;
            }
            
        </script>
    </head>
    <body>
        
        <button onclick="total()">Alert, Hi</button>

        <div id="demo"></div>

         
    </body>
</html>
