<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var count = 0;

        function increament() {
           count + 1;
            document.getElementById("demo").innerHTML = count;
        }

        function decreament() {
         count - 1;
            document.getElementById("demo").innerHTML = count;
        }
    </script>
</head>
<body>
    <p id="demo">0</p>

    <button onclick="increament()">+</button>
    <button onclick="decreament()">-</button>
</body>
</html>
