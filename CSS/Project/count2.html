<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            display: flex;
            padding: 6px;
            align-items: center;
            justify-content: center;
        }
    </style>
    <script>

        //asign and define 
        var count = 0;

        //increament function for increase the number
        function increament(){
            count = count + 1;
            document.getElementById("demo").innerHTML=count;
        }

        //decreament function to decrease the number
        function decreament(){
            if(count > 0){
                count = count - 1;
            }
            document.getElementById("demo").innerHTML=count;
        }
    </script>
</head>
<body>
    

    <button  onclick="increament()">+</button>
    <p id="demo">0</p>
    <button  onclick="decreament()">-</button>
</body>
</html>
