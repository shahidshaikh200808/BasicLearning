<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Website | CodingNepal</title>
    <link href="coffeestyle.css" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!--Header | Navbar-->
    <header>
        <nav class="navbar section-content">
            <a href="#" class="nav-logo">
                <h2 class="logo-text">Coffee</h2>
            </a>
            <ul class="nav-menu">
                <button id="menu-close-button" class="fas fa-times"></button>

                <li class="nav-item">
                    <a href="" class="nav-link">HOME</a>
                </li>

                <li class="nav-item">
                    <a href="" class="nav-link">ABOUT</a>
                </li>


                <li class="nav-item">
                    <a href="" class="nav-link">MENU</a>
                </li>

                <li class="nav-item">
                    <a href="" class="nav-link">TESTIMONIALS</a>
                </li>


                <li class="nav-item">
                    <a href="" class="nav-link">GALLERY</a>
                </li>


                <li class="nav-item">
                    <a href="" class="nav-link">CONTACT</a>
                </li>
            </ul>
            <button id="menu-open-button" class="fas fa-bars"></button>

        </nav>
    </header>
    <main>
        <!--Hero Sectiion-->
        <section class="hero-section">
            <div class="section-content">
                <div class="hero-details">
                    <h2 class="title">Best Coffee</h2>
                    <h3 class="sub-title">Make your day great with our special coffee!</h3>
                    <p class="description">Welcome to our coffee paradise,where every bean tells a story and every
                        cup sparks joy.</p>

                    <div class="buttons">
                        <a href class="button order-now">Order Now</a>
                        <a href class="button contact-us">Contact Us</a>
                    </div>
                </div>
                <div class="hero-image-wrapper">
                    <img src="images/coffee-hero-section.png" alt="Hero" class="hero-image">
                </div>
            </div>
        </section>
    </main>
    <script src="coffeescript.js"></script>
</body>

</html>
