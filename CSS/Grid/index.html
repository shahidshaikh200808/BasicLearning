<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <style>
            *{
                margin:0;
                padding: 0;
                box-sizing: content-box;
            }
            body{
                font-family: "Roboto", sans-serif;
                background-color: #000;                
                font-style: normal;
            }
            .container{                
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;                
                justify-content: space-evenly;
            }
            .leftarea{
                width: 30%;
            }
            .rightarea{
                border: 1px solid red;
                width: 50%;
                display: grid;
                gap: 10px;
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: 120px;
            }

            .box{
                color:#fff;
                background-color: #222;
                background-blend-mode: hard-light;

                display: flex;               
                justify-content: center;
                align-items: center;

                transition: all 1s;

                
            }
                .box:hover{ align-items: center;
}
            .row-2{
                grid-row: span 2/auto;
            }

            .col-2{
                grid-column: span 2;
            }
            #box1{background-image: url("https://plus.unsplash.com/premium_photo-1724754604549-f48d1caab92a?q=80&w=387&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D");}
            #box2{background-image:url("//images.unsplash.com/photo-1628859017536-c2f1d69f3c84?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8ZHViYWl8ZW58MHx8MHx8fDA%3D")}
            #box3{background-image:url("https://images.unsplash.com/photo-1613930648631-7191115e83d4?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8Nnx8aXJhbnxlbnwwfHwwfHx8MA%3D%3D")}
             #box4{background-image:url("https://images.unsplash.com/photo-1695735680024-41fdcefc5875?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OHx8a3V3YWl0fGVufDB8fDB8fHww")}
              #box5{background-image:url("https://images.unsplash.com/photo-1718680962024-0fa899e1815e?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8aXJhcXxlbnwwfHwwfHx8MA%3D%3D")}
               #box6{background-image:url("https://images.unsplash.com/photo-1606813332135-228593b6e201?q=80&w=388&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D")}
                #box7{background-image:url("https://images.unsplash.com/photo-1669525994669-5812bf141021?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8OXx8YWZnaGFuaXN0YW58ZW58MHx8MHx8fDA%3D")}





            </style>
    </head>
    <body>
        <div class="container">
            <div class="leftarea">
                <h1 class="heading">Gallery</h1>
                <p class="subheading"> some some text.</p>
            </div>
            <div class="rightarea">
                <div class="box row-2" id="box1">image 1</div>
                <div class="box col-2" id="box2">image 2</div>
                <div class="box" id="box3">image 3</div>
                <div class="box row-2" id="box4">image 4</div>
                <div class="box col-2" id="box5">image 5</div>
                <div class="box" id="box6">image 6</div>
                <div class="box col-2" id="box7">image 7</div>
            </div>
        </div>
    </body>
</html>
